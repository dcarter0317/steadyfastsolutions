name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  # Served at https://dcartdevelopment.com/steadyfastsolutions/
  DEPLOY_SUBFOLDER: steadyfastsolutions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ env.DEPLOY_SUBFOLDER }}/
          SITE_URL: https://dcartdevelopment.com/${{ env.DEPLOY_SUBFOLDER }}
        run: npm run build

      - name: Upload dist/ to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          # Path relative to the FTP user's login directory. Override with the FTP_ROOT repo secret
          # if the FTP user is already rooted at public_html (then set it to "/").
          server-dir: ${{ secrets.FTP_ROOT || '/domains/dcartdevelopment.com/public_html/' }}${{ env.DEPLOY_SUBFOLDER }}/
