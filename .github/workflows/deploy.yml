name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  # Served at https://dcartdevelopment.com/steadyfastsolutions/
  DEPLOY_SUBFOLDER: steadyfastsolutions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ env.DEPLOY_SUBFOLDER }}/
          SITE_URL: https://dcartdevelopment.com/${{ env.DEPLOY_SUBFOLDER }}
        run: npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync dist/ to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          REMOTE_DIR="domains/dcartdevelopment.com/public_html/${DEPLOY_SUBFOLDER}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-65002}" \
            --rsync-path="mkdir -p ${REMOTE_DIR} && rsync" \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"
